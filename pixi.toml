[workspace]
name = "ic-gvins"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
ros-jazzy-ros-base = "*"
ros-jazzy-sensor-msgs = "*"
ros-jazzy-nav-msgs = "*"
ros-jazzy-geometry-msgs = "*"
ros-jazzy-tf2-ros = "*"
ros-jazzy-launch-ros = "*"
ros-jazzy-rosbag2 = "*"
ros-dev-tools = "*"
compilers = "*"
cmake = ">=3.20,<4"
ninja = "*"
pkg-config = "*"
opencv = ">=4,<5"
eigen = ">=3.3.7,<4"
yaml-cpp = "*"
ceres-solver = ">=2.1,<3"
tbb = "*"
glog = ">=0.4"
ros-jazzy-rmw-cyclonedds-cpp = ">=2.2.3,<3"
tbb-devel = ">=2023.1.0,<2024"
ros-jazzy-rviz2 = ">=14.1.19,<15"

[activation.env]
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
CYCLONEDDS_URI = "file://$PIXI_PROJECT_ROOT/ic_gvins/config/cyclonedds_localhost.xml"

[tasks]
build = "colcon build --base-paths ic_gvins --packages-select ic_gvins --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew"
start = "bash -c 'source install/local_setup.bash && exec ros2 launch ic_gvins ic_gvins.launch.py use_rviz:=true'"
